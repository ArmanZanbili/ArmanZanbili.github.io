
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff0f5">
  <title>یه سؤال کوچولو ❤️</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
</head>
<body>
  <main class="page">

    <section class="card" id="questionCard">

      <div class="bear">
        <div class="ear left"></div>
        <div class="ear right"></div>

        <div class="head">
          <span class="eye e1"></span>
          <span class="eye e2"></span>
          <span class="cheek c1"></span>
          <span class="cheek c2"></span>
          <span class="muzzle"></span>
        </div>

        <div class="body-bear">
          <span class="heart">♥</span>
        </div>
        <div class="paw p1"></div>
        <div class="paw p2"></div>
      </div>

      <p class="eyebrow">یه سؤال مهم و کوچولو...</p>

      <h1>اجازه هست من قربونت برم؟</h1>

      <p class="sub">
        قول می‌دم خیلی خیلی مواظب دلت باشم! 🥺
      </p>

      <div class="buttons">
        <button class="yes" id="yesBtn">آره ❤️</button>
        <button class="no" id="noBtn">نه 🙈</button>
      </div>

      <p class="hint" id="hint">
        با دلت جواب بده، عجله‌ای نیست 💗
      </p>
    </section>

    <section class="card final-card hidden" id="finalCard">
      <div class="big-heart">💗</div>
      <div class="confetti">✨ 💕 ✨</div>

      <p class="eyebrow">وای که چقدر خوشحالم!</p>

      <h1>
        مشترک گرامی،<br>
        من قربونتون رفتم دیگه! 🥹💗😂
      </h1>

      <p class="sub">
        از این به بعد سعی میکنم ناراحتت نکنم جدی هدی جانم 🌷
      </p>

      <div class="love-stamp">با کلی ذوق❤️</div>
    </section>

    <footer>ساخته‌شده با ❤️ توسط آرمان</footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
